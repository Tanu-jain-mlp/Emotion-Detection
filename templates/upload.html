<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload - Emotion Detection</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f0f2f5; font-family: Arial, sans-serif; }
.container { margin-top: 50px; max-width: 700px; }
.card { padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); text-align: center; background: white; }
.btn-custom { background: #6C63FF; color: white; width: 100%; padding: 10px; margin-top: 15px; }
.btn-custom:hover { background: #5751d9; }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2 class="mb-3">Upload Image for Emotion Detection</h2>

        <form method="POST" action="/upload" enctype="multipart/form-data">
            <input type="text" name="username" placeholder="Enter your name" class="form-control mb-2" required>
            <input type="file" name="file" class="form-control mb-2" required>
            <button type="submit" class="btn btn-custom">Upload & Detect</button>
        </form>

        <div class="text-center mt-3">
            <a href="/view_log" class="btn btn-primary">View Emotion Log</a>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
