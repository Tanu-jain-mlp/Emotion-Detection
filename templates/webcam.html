<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webcam - Emotion Detection</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f0f2f5; font-family: Arial, sans-serif; }
.container { margin-top: 50px; max-width: 700px; }
.card { padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); text-align: center; }
.btn-custom { background: #6C63FF; color: white; width: 100%; padding: 10px; margin-top: 15px; }
.btn-custom:hover { background: #5751d9; }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2 class="mb-3">Webcam Detection</h2>

        <video id="video" width="320" height="240" autoplay class="mb-2"></video>
        <p id="result"></p>

        <input type="text" id="username" placeholder="Enter your name" class="form-control mb-2">
        <button type="button" id="capture" class="btn btn-custom">Capture Emotion</button>

        <div class="text-center mt-3">
            <a href="/view_log" class="btn btn-primary">View Emotion Log</a>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
</div>

<script>
const video = document.getElementById('video');
navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => { video.srcObject = stream; })
    .catch(err => { console.error("Error accessing webcam: ", err); });

document.getElementById('capture').addEventListener('click', () => {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('file', blob, 'capture.png');
        formData.append('username', document.getElementById('username').value || 'Unknown');

        fetch('/webcam', { method: 'POST', body: formData })
            .then(res => res.text())
            .then(data => { document.getElementById('result').textContent = data; })
            .catch(err => console.error(err));
    }, 'image/png');
});
</script>

</body>
</html>
