<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotion Log</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f0f2f5; font-family: Arial, sans-serif; }
.container { margin-top: 50px; max-width: 900px; }
.card { padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); background: white; text-align: center; }
table { width: 100%; margin-top: 20px; }
th, td { text-align: center; padding: 12px; }
th { background-color: #6C63FF; color: white; }
tr:nth-child(even) { background-color: #f2f2f2; }
.btn-back { margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>User Emotion Log</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Emotion</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in logs %}
                <tr>
                    <td>{{ entry.username }}</td>
                    <td>{{ entry.emotion }}</td>
                    <td>{{ entry.timestamp }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="text-center btn-back">
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
